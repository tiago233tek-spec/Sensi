<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel ADM</title><link rel="stylesheet" href="style.css"></head>
<body><header><h1>PAINEL <span>ADM</span></h1><a href="/">SITE</a></header>
<main><section class="panel" id="login"><h2>Administrador</h2><input id="pass" type="password" placeholder="Senha do administrador"><button onclick="login()">ENTRAR</button><p id="msg"></p></section>
<section class="panel hidden" id="dashboard"><h2>Publicar vídeo de Sensi</h2>
<input id="title" placeholder="Título"><input id="url" placeholder="URL do vídeo (YouTube, MP4 etc.)"><input id="thumb" placeholder="URL da thumbnail">
<div class="row"><select id="brand"><option>Motorola</option><option>Samsung</option><option>Xiaomi</option><option>Infinix</option></select>
<select id="level"><option>Baixa</option><option>Média</option><option>Alta</option></select></div>
<textarea id="desc" placeholder="Descrição"></textarea><button onclick="addVideo()">PUBLICAR</button>
<hr><button onclick="newKey()">GERAR KEY DE COMPRADOR</button><p id="newkey"></p><div id="list"></div></section></main>
<script src="admin.js"></script></body></html>
