<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADM — Demenor Sensi</title><link rel="stylesheet" href="/style.css"></head><body><header><div class="logo">DEMENOR <span>SENSI</span> — ADM</div><a href="/">SITE</a></header><main><section class="panel" id="loginPanel"><h1>🔐 Administrador</h1><input id="pass" type="password" placeholder="Senha do administrador"><button id="enter">ENTRAR</button><p id="msg"></p></section><section class="panel hidden" id="adminPanel"><h1>Publicar vídeo</h1><form id="form"><input name="title" placeholder="Título do vídeo" required><select name="brand"><option>Motorola</option><option>Samsung</option><option>Xiaomi</option><option>Infinix</option></select><select name="level"><option>Baixa</option><option>Média</option><option>Alta</option></select><textarea name="description" placeholder="Descrição (opcional)"></textarea><input name="video" type="file" accept="video/*" required><button>PUBLICAR VÍDEO</button></form><h2>Vídeos publicados</h2><div id="list"></div></section></main><script>let pwd='';const p=document.getElementById('pass'),m=document.getElementById('msg'),lp=document.getElementById('loginPanel'),ap=document.getElementById('adminPanel'),f=document.getElementById('form'),list=document.getElementById('list');document.getElementById('enter').onclick=login;p.onkeydown=e=>{if(e.key==='Enter')login()};async function login(){let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p.value})}),d=await r.json();if(!d.ok){m.textContent='Senha incorreta.';return}pwd=p.value;lp.classList.add('hidden');ap.classList.remove('hidden');load()}async function load(){let a=await fetch('/api/videos').then(r=>r.json());list.innerHTML=a.length?a.map(v=>`<div class="row"><span><b>${esc(v.title)}</b><small>${esc(v.brand)} • ${esc(v.level)}</small></span><button class="danger" onclick="del('${esc(v.id)}')">EXCLUIR</button></div>`).join(''):'<p>Nenhum vídeo publicado.</p>'}f.onsubmit=async e=>{e.preventDefault();let fd=new FormData(f),r=await fetch('/api/videos',{method:'POST',headers:{'x-admin-password':pwd},body:fd}),d=await r.json();if(!r.ok)return alert(d.error);f.reset();load()};async function del(id){if(!confirm('Excluir este vídeo?'))return;await fetch('/api/videos/'+encodeURIComponent(id),{method:'DELETE',headers:{'x-admin-password':pwd}});load()}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
