<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel Demenor Sensi</title>
<style>
body{margin:0;background:#090909;color:#fff;font-family:Arial}.wrap{max-width:850px;margin:auto;padding:25px 18px}.box{background:#151515;border:1px solid #292929;border-radius:15px;padding:18px;margin:15px 0}input,select,textarea{width:100%;box-sizing:border-box;background:#0d0d0d;color:#fff;border:1px solid #333;border-radius:8px;padding:11px;margin:6px 0}.btn{background:#8d2be8;color:#fff;border:0;border-radius:8px;padding:11px 14px;font-weight:bold;margin-top:7px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{border-top:1px solid #333;padding:14px 0}.danger{background:#a52b2b}@media(max-width:600px){.row{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap"><h1>DEMENOR SENSI — PAINEL</h1>
<div id="login" class="box"><h2>🔐 Administrador</h2><input id="pass" type="password" placeholder="Senha do administrador"><button class="btn" onclick="login()">ENTRAR</button><p id="err"></p></div>
<div id="panel" style="display:none">
<div class="box"><h2>➕ Novo vídeo</h2><div class="row"><select id="brand"><option>Motorola</option><option>Samsung</option><option>Xiaomi</option><option>Infinix</option><option>HUD</option></select><input id="title" placeholder="Título"></div>
<textarea id="description" placeholder="Descrição"></textarea><input id="url" placeholder="URL do vídeo / embed"><input id="thumbnail" placeholder="URL da thumbnail (opcional)"><button class="btn" onclick="save()">PUBLICAR VÍDEO</button></div>
<div class="box"><h2>🎥 Vídeos publicados</h2><div id="list"></div></div>
</div></div>
<script>
async function login(){let r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pass.value})});if(!r.ok){err.textContent="Senha incorreta";return}document.getElementById("login").style.display="none";document.getElementById("panel").style.display="block";load()}
async function load(){let r=await fetch("/api/admin/videos");if(r.status===401)return;let a=await r.json();document.getElementById("list").innerHTML=a.map(v=>`<div class="item"><b>${esc(v.title)}</b><br><small>${esc(v.brand)}</small><br><button class="btn danger" onclick="del(${v.id})">EXCLUIR</button></div>`).join("")||"<p>Nenhum vídeo.</p>"}
async function save(){let body={brand:brand.value,title:title.value,description:description.value,url:url.value,thumbnail:thumbnail.value};let r=await fetch("/api/admin/videos",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});if(!r.ok){alert("Confira os campos.");return}title.value=description.value=url.value=thumbnail.value="";alert("Vídeo publicado!");load()}
async function del(id){if(!confirm("Excluir este vídeo?"))return;await fetch("/api/admin/videos/"+id,{method:"DELETE"});load()}
function esc(x){return String(x||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
</script></body></html>
