<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel ADM - Demenor Sensi</title>

  <link rel="stylesheet" href="/style.css">

  <style>
    .admin-container {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
    }

    .panel {
      background: #071225;
      border: 1px solid #087cff;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 0 25px rgba(0, 119, 255, .25);
      margin-bottom: 20px;
    }

    .panel h1,
    .panel h2 {
      color: #168cff;
    }

    .panel input,
    .panel select,
    .panel textarea {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border-radius: 10px;
      border: 1px solid #087cff;
      background: #020812;
      color: white;
      font-size: 16px;
    }

    .panel textarea {
      min-height: 100px;
      resize: vertical;
    }

    .panel button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(135deg, #087cff, #0047c7);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .video-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 15px;
      margin-top: 10px;
      border: 1px solid #123d70;
      border-radius: 12px;
      background: #030a15;
    }

    .video-info {
      flex: 1;
    }

    .video-info strong {
      color: #168cff;
      display: block;
      margin-bottom: 5px;
    }

    .video-info small {
      color: #aaa;
    }

    .delete {
      width: auto !important;
      padding: 10px 15px !important;
      background: #b00020 !important;
      margin: 0 !important;
    }

    .back {
      display: inline-block;
      margin-top: 15px;
      color: #168cff;
      text-decoration: none;
    }

    #message {
      color: #ffcc00;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">
    DEMENOR <span>SENSI</span>
  </div>

  <a href="/">INÍCIO</a>
</header>

<main class="admin-container">

  <!-- LOGIN -->
  <section class="panel" id="loginPanel">

    <h1>🔐 PAINEL ADM</h1>

    <p>Entre para administrar seus vídeos.</p>

    <input
      id="password"
      type="password"
      placeholder="Senha do administrador"
    >

    <button id="loginButton">
      ENTRAR
    </button>

    <p id="message"></p>

  </section>


  <!-- PAINEL -->
  <section class="panel hidden" id="adminPanel">

    <h1>👑 Painel Administrativo</h1>

    <h2>Adicionar vídeo</h2>

    <form id="videoForm">

      <input
        name="title"
        type="text"
        placeholder="Título do vídeo"
        required
      >

      <select name="brand" required>
        <option value="Motorola">Motorola</option>
        <option value="Samsung">Samsung</option>
        <option value="Xiaomi">Xiaomi</option>
        <option value="Infinix">Infinix</option>
      </select>

      <select name="level" required>
        <option value="Baixa">Sensi Baixa</option>
        <option value="Média">Sensi Média</option>
        <option value="Alta">Sensi Alta</option>
      </select>

      <textarea
        name="description"
        placeholder="Descrição do vídeo"
      ></textarea>

      <input
        name="video"
        type="file"
        accept="video/*"
        required
      >

      <button type="submit">
        📤 PUBLICAR VÍDEO
      </button>

    </form>

    <h2>📹 Vídeos publicados</h2>

    <div id="videoList">
      Carregando...
    </div>

    <a class="back" href="/">
      ← Voltar para o site
    </a>

  </section>

</main>


<script>

let adminPassword = "";

const loginPanel = document.getElementById("loginPanel");
const adminPanel = document.getElementById("adminPanel");
const passwordInput = document.getElementById("password");
const message = document.getElementById("message");
const videoForm = document.getElementById("videoForm");
const videoList = document.getElementById("videoList");


// ENTRAR
document.getElementById("loginButton").addEventListener("click", login);

passwordInput.addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    login();
  }
});


async function login() {

  const password = passwordInput.value.trim();

  if (!password) {
    message.textContent = "Digite a senha.";
    return;
  }

  try {

    const response = await fetch("/api/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        password: password
      })
    });

    const data = await response.json();

    if (!data.ok) {
      message.textContent = "Senha incorreta.";
      return;
    }

    adminPassword = password;

    loginPanel.classList.add("hidden");
    adminPanel.classList.remove("hidden");

    carregarVideos();

  } catch (error) {

    message.textContent = "Erro ao conectar ao servidor.";

  }

}


// PUBLICAR VÍDEO
videoForm.addEventListener("submit", async function(event) {

  event.preventDefault();

  const button = videoForm.querySelector("button");

  button.disabled = true;
  button.textContent = "ENVIANDO...";

  try {

    const formData = new FormData(videoForm);

    const response = await fetch("/api/videos", {
      method: "POST",
      headers: {
        "x-admin-password": adminPassword
      },
      body: formData
    });

    const data = await response.json();

    if (!response.ok) {
      alert(data.error || "Erro ao publicar vídeo.");
      return;
    }

    alert("Vídeo publicado com sucesso! 🎉");

    videoForm.reset();

    carregarVideos();

  } catch (error) {

    alert("Erro ao enviar o vídeo.");

  } finally {

    button.disabled = false;
    button.textContent = "📤 PUBLICAR VÍDEO";

  }

});


// CARREGAR VÍDEOS
async function carregarVideos() {

  try {

    const response = await fetch("/api/videos");
    const videos = await response.json();

    if (!videos.length) {

      videoList.innerHTML =
        "<p>Nenhum vídeo publicado ainda.</p>";

      return;
    }

    videoList.innerHTML = videos.map(video => `

      <div class="video-item">

        <div class="video-info">

          <strong>${escapar(video.title)}</strong>

          <small>
            ${escapar(video.brand)}
            •
            Sensi ${escapar(video.level)}
          </small>

        </div>

        <button
          class="delete"
          onclick="excluirVideo('${video.id}')"
        >
          EXCLUIR
        </button>

      </div>

    `).join("");

  } catch (error) {

    videoList.innerHTML =
      "<p>Não foi possível carregar os vídeos.</p>";

  }

}


// EXCLUIR
async function excluirVideo(id) {

  if (!confirm("Tem certeza que deseja excluir este vídeo?")) {
    return;
  }

  try {

    const response = await fetch(
      "/api/videos/" + encodeURIComponent(id),
      {
        method: "DELETE",
        headers: {
          "x-admin-password": adminPassword
        }
      }
    );

    const data = await response.json();

    if (!response.ok) {
      alert(data.error || "Erro ao excluir.");
      return;
    }

    alert("Vídeo excluído.");

    carregarVideos();

  } catch (error) {

    alert("Erro ao excluir o vídeo.");

  }

}


// SEGURANÇA DO TEXTO
function escapar(texto) {

  return String(texto)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>
  </html>
