<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Painel ADM - Demenor Sensi</title>

  <link rel="stylesheet" href="/style.css">

</head>

<body>

<header>

  <div class="brand-logo">
    👑 DEMENOR <span>SENSI</span>
  </div>

  <a class="admin-button" href="/">
    🏠 Voltar para o site
  </a>

</header>


<main>

  <!-- LOGIN -->

  <section
    id="login"
    class="admin-box"
  >

    <h1>🔐 PAINEL ADM</h1>

    <p>
      Entre para administrar seus vídeos.
    </p>

    <input
      id="password"
      type="password"
      placeholder="Senha do ADM"
    >

    <button
      id="loginButton"
      class="admin-action"
    >
      ENTRAR
    </button>

    <p id="loginMessage"></p>

  </section>


  <!-- PAINEL -->

  <section
    id="panel"
    class="admin-box"
    style="display:none"
  >

    <h1>👑 Painel Administrativo</h1>

    <h2>📤 Publicar novo vídeo</h2>

    <form id="videoForm">

      <label>
        Título
      </label>

      <input
        name="title"
        type="text"
        placeholder="Ex: Sensi Alta Motorola"
        required
      >


      <label>
        Celular
      </label>

      <select name="brand">

        <option value="Motorola">
          Motorola
        </option>

        <option value="Samsung">
          Samsung
        </option>

        <option value="Xiaomi">
          Xiaomi
        </option>

        <option value="Infinix">
          Infinix
        </option>

      </select>


      <label>
        Sensibilidade
      </label>

      <select name="level">

        <option value="Baixa">
          Sensi Baixa
        </option>

        <option value="Média">
          Sensi Média
        </option>

        <option value="Alta">
          Sensi Alta
        </option>

      </select>


      <label>
        Descrição
      </label>

      <textarea
        name="description"
        placeholder="Descrição do vídeo"
      ></textarea>


      <label>
        Seu vídeo
      </label>

      <input
        name="video"
        type="file"
        accept="video/*"
        required
      >


      <button
        class="admin-action"
        type="submit"
      >
        📤 PUBLICAR VÍDEO
      </button>

    </form>


    <h2>
      🎥 Vídeos publicados
    </h2>

    <div id="videoList">
      Carregando...
    </div>

  </section>

</main>


<style>

.admin-box {
  max-width: 850px;

  margin:
    40px auto;

  padding: 25px;

  border:
    1px solid #087cff;

  border-radius: 18px;

  background:
    linear-gradient(
      145deg,
      #071529,
      #02060e
    );

  box-shadow:
    0 0 25px
    rgba(0, 102, 255, 0.25);
}


.admin-box h1,
.admin-box h2 {
  color: #168cff;
}


.admin-box input,
.admin-box select,
.admin-box textarea {

  width: 100%;

  padding: 14px;

  margin:
    7px 0 18px;

  border:
    1px solid #087cff;

  border-radius: 10px;

  background: #020812;

  color: white;

  font-size: 16px;

  outline: none;

}


.admin-box textarea {

  min-height: 100px;

  resize: vertical;

}


.admin-action {

  width: 100%;

  padding: 15px;

  border: 0;

  border-radius: 10px;

  background:
    linear-gradient(
      135deg,
      #168cff,
      #0048d0
    );

  color: white;

  font-size: 16px;

  font-weight: bold;

  cursor: pointer;
}


.video-admin {

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 15px;

  padding: 15px;

  margin:
    10px 0;

  border:
    1px solid #123d70;

  border-radius: 12px;

  background: #030a15;
}


.video-admin strong {
  color: #168cff;
}


.delete {

  width: auto;

  padding:
    10px 15px;

  border: 0;

  border-radius: 8px;

  background: #b00020;

  color: white;

  font-weight: bold;
}


@media (max-width: 600px) {

  .admin-box {
    margin: 20px 12px;
    padding: 18px;
  }

  .video-admin {
    flex-direction: column;
    align-items: stretch;
  }

}

</style>


<script>

let adminPassword = "";


const login =
  document.getElementById("login");

const panel =
  document.getElementById("panel");

const password =
  document.getElementById("password");

const loginMessage =
  document.getElementById("loginMessage");

const videoForm =
  document.getElementById("videoForm");

const videoList =
  document.getElementById("videoList");


document
  .getElementById("loginButton")
  .addEventListener(
    "click",
    entrar
  );


async function entrar() {

  const senha =
    password.value.trim();

  if (!senha) {

    loginMessage.textContent =
      "Digite a senha.";

    return;
  }


  try {

    const response =
      await fetch("/api/login", {

        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({
          password: senha
        })

      });


    const data =
      await response.json();


    if (!data.ok) {

      loginMessage.textContent =
        data.error ||
        "Senha incorreta.";

      return;
    }


    adminPassword = senha;

    login.style.display = "none";

    panel.style.display = "block";

    carregarVideos();

  } catch {

    loginMessage.textContent =
      "Erro ao conectar ao servidor.";

  }

}


password.addEventListener(
  "keydown",
  event => {

    if (event.key === "Enter") {
      entrar();
    }

  }
);


videoForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const button =
      videoForm.querySelector(
        "button[type='submit']"
      );


    button.disabled = true;

    button.textContent =
      "⏳ ENVIANDO...";


    try {

      const formData =
        new FormData(videoForm);


      const response =
        await fetch(
          "/api/videos",
          {
            method: "POST",

            headers: {
              "x-admin-password":
                adminPassword
            },

            body: formData
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        alert(
          data.error ||
          "Erro ao publicar."
        );

        return;
      }


      alert(
        "Vídeo publicado com sucesso! 🎉"
      );


      videoForm.reset();

      carregarVideos();

    } catch {

      alert(
        "Erro ao enviar o vídeo."
      );

    } finally {

      button.disabled = false;

      button.textContent =
        "📤 PUBLICAR VÍDEO";

    }

  }
);


async function carregarVideos() {

  try {

    const response =
      await fetch(
        "/api/videos"
      );


    const videos =
      await response.json();


    if (!videos.length) {

      videoList.innerHTML =
        "<p>Nenhum vídeo publicado.</p>";

      return;
    }


    videoList.innerHTML =
      videos.map(video => `

        <div class="video-admin">

          <div>

            <strong>
              ${esc(video.title)}
            </strong>

            <br>

            📱 ${esc(video.brand)}

            • Sensi ${esc(video.level)}

          </div>

          <button
            class="delete"
            onclick="excluir('${esc(video.id)}')"
          >
            🗑️ EXCLUIR
          </button>

        </div>

      `).join("");

  } catch {

    videoList.innerHTML =
      "<p>Erro ao carregar vídeos.</p>";

  }

}


async function excluir(id) {

  if (
    !confirm(
      "Deseja excluir este vídeo?"
    )
  ) {
    return;
  }


  try {

    const response =
      await fetch(
        "/api/videos/" +
        encodeURIComponent(id),
        {
          method: "DELETE",

          headers: {
            "x-admin-password":
              adminPassword
          }
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      alert(
        data.error ||
        "Erro ao excluir."
      );

      return;
    }


    carregarVideos();

  } catch {

    alert(
      "Erro ao excluir o vídeo."
    );

  }

}


function esc(text) {

  return String(text || "")
    .replace(
      /[&<>"']/g,
      char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]
    );

}

</script>

</body>
    </html>
