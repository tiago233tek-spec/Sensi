<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demenor Sensi</title><link rel="stylesheet" href="/style.css"></head><body><header><div class="logo">DEMENOR <span>SENSI</span></div><a href="/admin.html">ADM</a></header><main><section class="hero"><b>DEMENOR SENSI</b><h1>SENSI PARA SEU CELULAR</h1><p>Vídeos de sensibilidade baixa, média e alta para Motorola, Samsung, Xiaomi e Infinix.</p></section><section class="filters"><select id="brand"><option value="">Todos os celulares</option><option>Motorola</option><option>Samsung</option><option>Xiaomi</option><option>Infinix</option></select><select id="level"><option value="">Todas as sensibilidades</option><option>Baixa</option><option>Média</option><option>Alta</option></select></section><section id="videos" class="grid"></section></main><script>const E=document.getElementById('videos'),B=document.getElementById('brand'),L=document.getElementById('level');let all=[];const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{all=await fetch('/api/videos').then(r=>r.json());render()}catch{E.innerHTML='<p>Erro ao carregar os vídeos.</p>'}}function render(){let a=all.filter(v=>(!B.value||v.brand===B.value)&&(!L.value||v.level===L.value));E.innerHTML=a.length?a.map(v=>`<article class="card"><video controls preload="metadata" src="${esc(v.url)}"></video><h2>${esc(v.title)}</h2><strong>${esc(v.brand)} • ${esc(v.level)}</strong><p>${esc(v.description||'')}</p></article>`).join(''):'<p>Nenhum vídeo publicado ainda.</p>'}B.onchange=L.onchange=render;load();</script></body></html>
